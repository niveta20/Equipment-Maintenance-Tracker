<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Maintenance Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-wrench me-2"></i>MaintTrack</a>
        </div>
    </nav>

    <div class="container">
        
        <!-- Dashboard Summary Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-3">
                    <div class="card-body">
                        <span class="text-muted fs-7">Total Equipment</span>
                        <h2 class="fw-bold mb-0 text-dark" id="stat-total">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-3 border-start border-success border-4">
                    <div class="card-body">
                        <span class="text-muted fs-7">Operational</span>
                        <h2 class="fw-bold mb-0 text-success" id="stat-operational">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-3 border-start border-warning border-4">
                    <div class="card-body">
                        <span class="text-muted fs-7">Needs Maintenance</span>
                        <h2 class="fw-bold mb-0 text-warning" id="stat-maint">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-3 border-start border-danger border-4">
                    <div class="card-body">
                        <span class="text-muted fs-7">Under Repair</span>
                        <h2 class="fw-bold mb-0 text-danger" id="stat-repair">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter & Search Controls -->
        <div class="card border-0 shadow-sm rounded-3 mb-4">
            <div class="card-body p-3">
                <div class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" id="search-input" class="form-control border-start-0" placeholder="Search by name, category, location...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="status-filter" class="form-select">
                            <option value="">All Statuses</option>
                            <option value="Operational">Operational</option>
                            <option value="Needs Maintenance">Needs Maintenance</option>
                            <option value="Under Repair">Under Repair</option>
                        </select>
                    </div>
                    <div class="col-md-3 text-end">
                        <button class="btn btn-primary w-100 fw-semibold" onclick="openAddModal()">
                            <i class="fa-solid fa-plus me-1"></i> Add Equipment
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Equipment Table -->
        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Last Serviced</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="equipment-tbody">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="equipmentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Equipment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="equipmentForm" onsubmit="saveEquipment(event)">
                    <div class="modal-body">
                        <input type="hidden" id="item-id">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Equipment Name *</label>
                            <input type="text" id="name" class="form-control" required placeholder="e.g. Air Compressor B">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category *</label>
                            <input type="text" id="category" class="form-control" required placeholder="e.g. Machinery">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Location *</label>
                            <input type="text" id="location" class="form-control" required placeholder="e.g. Workshop Zone 2">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Status *</label>
                            <select id="status" class="form-select" required>
                                <option value="Operational">Operational</option>
                                <option value="Needs Maintenance">Needs Maintenance</option>
                                <option value="Under Repair">Under Repair</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Last Serviced Date *</label>
                            <input type="date" id="last_serviced" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application Script -->
    <script>
        let modal;

        document.addEventListener('DOMContentLoaded', () => {
            modal = new bootstrap.Modal(document.getElementById('equipmentModal'));
            loadDashboardStats();
            loadEquipment();

            // Event Listeners for Filters
            document.getElementById('search-input').addEventListener('input', loadEquipment);
            document.getElementById('status-filter').addEventListener('change', loadEquipment);
        });

        // Fetch & Render Summary Dashboard
        async function loadDashboardStats() {
            const res = await fetch('/api/dashboard/stats');
            const data = await res.json();
            if (data.success) {
                document.getElementById('stat-total').innerText = data.stats.total;
                document.getElementById('stat-operational').innerText = data.stats.operational;
                document.getElementById('stat-maint').innerText = data.stats.needs_maint;
                document.getElementById('stat-repair').innerText = data.stats.repair;
            }
        }

        // Fetch & Render Main Table Data
        async function loadEquipment() {
            const search = document.getElementById('search-input').value;
            const status = document.getElementById('status-filter').value;
            
            const res = await fetch(`/api/equipment?search=${encodeURIComponent(search)}&status=${encodeURIComponent(status)}`);
            const data = await res.json();
            
            const tbody = document.getElementById('equipment-tbody');
            tbody.innerHTML = '';

            if (data.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No equipment records found</td></tr>`;
                return;
            }

            data.data.forEach((item, index) => {
                let badgeClass = 'bg-success';
                if (item.status === 'Needs Maintenance') badgeClass = 'bg-warning text-dark';
                if (item.status === 'Under Repair') badgeClass = 'bg-danger';

                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="fw-semibold">${escapeHtml(item.name)}</td>
                        <td>${escapeHtml(item.category)}</td>
                        <td>${escapeHtml(item.location)}</td>
                        <td><span class="badge ${badgeClass}">${item.status}</span></td>
                        <td>${item.last_serviced}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${item.id})">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteEquipment(${item.id})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // Open Modal for Create
        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Add Equipment';
            document.getElementById('item-id').value = '';
            document.getElementById('equipmentForm').reset();
            modal.show();
        }

        // Open Modal for Edit (Populates form via GET API)
        async function openEditModal(id) {
            const res = await fetch(`/api/equipment/${id}`);
            const data = await res.json();
            if (data.success) {
                const item = data.data;
                document.getElementById('modalTitle').innerText = 'Edit Equipment';
                document.getElementById('item-id').value = item.id;
                document.getElementById('name').value = item.name;
                document.getElementById('category').value = item.category;
                document.getElementById('location').value = item.location;
                document.getElementById('status').value = item.status;
                document.getElementById('last_serviced').value = item.last_serviced;
                modal.show();
            }
        }

        // Form Submit Handler (Handles Create & Update)
        async function saveEquipment(event) {
            event.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                status: document.getElementById('status').value,
                last_serviced: document.getElementById('last_serviced').value
            };

            const url = id ? `/api/equipment/${id}` : '/api/equipment';
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            if (result.success) {
                modal.hide();
                loadEquipment();
                loadDashboardStats();
            } else {
                alert(result.message || 'Validation error');
            }
        }

        // Delete Handler
        async function deleteEquipment(id) {
            if (!confirm('Are you sure you want to delete this equipment entry?')) return;

            const res = await fetch(`/api/equipment/${id}`, { method: 'DELETE' });
            const result = await res.json();

            if (result.success) {
                loadEquipment();
                loadDashboardStats();
            } else {
                alert(result.message);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
